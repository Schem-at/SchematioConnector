span x="328" y="88.05" textLength="194.825" lengthAdjust="spacingAndGlyphs" data-line-width="194.825" data-full-text="Add settings, then press Enter.">Add settings, then press Enter.</tspan></text></g></g><g id="tool-workflow-960-node-stack-3" class="kg-node kg-node--group" data-node-id="stack-3" data-kineglyph-node="stack-3" data-kind="group" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><g id="tool-workflow-960-node-eyebrow-03-paste" class="kg-node kg-node--text" data-node-id="eyebrow-03-paste" data-kineglyph-node="eyebrow-03-paste" data-kind="text" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><text class="kg-text" data-text-of="eyebrow-03-paste" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.1" fill="var(--kg-color-success, #a9cf8b)" data-wrap-lines="1" data-max-width="81.843" data-text-reveal="lines"><tspan x="656" y="31.2" textLength="81.843" lengthAdjust="spacingAndGlyphs" data-line-width="81.843" data-full-text="03 / PASTE">03 / PASTE</tspan></text></g><g id="tool-workflow-960-node-heading-paste-the-result" class="kg-node kg-node--text" data-node-id="heading-paste-the-result" data-kineglyph-node="heading-paste-the-result" data-kind="text" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><text class="kg-text" data-text-of="heading-paste-the-result" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="var(--kg-color-text, #eeeaf0)" data-wrap-lines="1" data-max-width="145.307" data-text-reveal="lines"><tspan x="656" y="61.3" textLength="145.307" lengthAdjust="spacingAndGlyphs" data-line-width="145.307" data-full-text="Paste the result">Paste the result</tspan></text></g><g id="tool-workflow-960-node-caption-it-fills-your-clipboard-run-past" class="kg-node kg-node--text" data-node-id="caption-it-fills-your-clipboard-run-past" data-kineglyph-node="caption-it-fills-your-clipboard-run-past" data-kind="text" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><text class