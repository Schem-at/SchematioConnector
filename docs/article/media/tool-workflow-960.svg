<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="tool-workflow-960" class="kg-scene" viewBox="0 0 960 111" preserveAspectRatio="xMidYMid meet" width="960" height="111" role="img" aria-labelledby="tool-workflow-960-title" aria-describedby="tool-workflow-960-description" data-kineglyph-scene="tool-workflow" data-layout="wide" style="--kg-color-canvas:#121315;--kg-color-surface:#18151c;--kg-color-surface-raised:#211c28;--kg-color-surface-muted:#17191b;--kg-color-border:#5d5268;--kg-color-text:#eeeaf0;--kg-color-text-muted:#b4aaba;--kg-color-accent:#e0ac7e;--kg-color-accent-contrast:#151716;--kg-color-connector:#84938a;--kg-color-info:#79c5d5;--kg-color-success:#a9cf8b;--kg-color-warning:#d6bd78;--kg-color-chart1:#8fac71;--kg-color-chart2:#637b53;--kg-color-chart3:#626d75;--kg-color-chart4:#a77858;--kg-color-chart5:#517f8a;--kg-color-chart6:#b9b8a7;--kg-background:var(--kg-color-canvas, #121315);--kg-node-fill:var(--kg-color-surface, #18151c);--kg-node-stroke:var(--kg-color-border, #5d5268);--kg-edge-stroke:var(--kg-color-connector, #84938a);--kg-text:var(--kg-color-text, #eeeaf0);--kg-text-muted:var(--kg-color-text-muted, #b4aaba);--kg-accent:var(--kg-color-accent, #e0ac7e);--kg-font-family:Arial, sans-serif;--kg-radius-lg:6px;--kg-radius-md:4px;--kg-radius-none:0px;--kg-radius-pill:999px;--kg-radius-sm:2px"><title id="tool-workflow-960-title">A tool result lands in your clipboard</title><desc id="tool-workflow-960-description">List the Schematio tools your role allows, run one from chat, then paste the result it puts in your WorldEdit clipboard.</desc><style>.kg-scene{color:var(--kg-text)}.kg-node-shape:not(.kg-path){vector-effect:non-scaling-stroke}.kg-nodes&gt;.kg-node .kg-node-shape:not([fill]){fill:var(--kg-node-fill)}.kg-node text{stroke:none}.kg-node-label,.kg-node-body,.kg-node-icon,.kg-edge-label{font-family:var(--kg-font-family)}.kg-node-label{fill:var(--kg-text);font-size:13px;font-weight:600}.kg-node-body{fill:var(--kg-text-muted);font-size:11px;font-weight:400}.kg-node-icon-bg{fill:var(--kg-accent);stroke:none}.kg-node-icon{fill:white;font-size:10px;font-weight:700}.kg-node-motif{fill:none;stroke:var(--kg-accent);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.kg-node-motif .kg-motif-backed{fill:var(--kg-background)}.kg-node-motif .kg-motif-solid{fill:var(--kg-accent)}.kg-edge,.kg-edge-casing,.kg-edge-flow-trace{vector-effect:non-scaling-stroke}.kg-edge-casing,.kg-edge-flow-trace{pointer-events:none}.kg-edge-label{fill:var(--kg-text)}.kg-node--interactive{cursor:pointer;outline:none}.kg-node--interactive:focus-visible&gt;.kg-node-shape,.kg-node--interactive[data-inspected=true]&gt;.kg-node-shape{stroke:var(--kg-accent);stroke-width:2}.kg-node--interactive:hover&gt;.kg-node-shape{filter:brightness(1.06)}@keyframes kg-flow{to{stroke-dashoffset:-1000}}.kg-edge--flowing{animation:kg-flow 40s linear infinite}.kg-scene[data-paused] .kg-edge--flowing,.kg-scene[data-reduced-motion] .kg-edge--flowing{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.kg-edge--flowing{animation:none}}</style><g class="kg-nodes"><g id="tool-workflow-960-node-stack-4" class="kg-node kg-node--group" data-node-id="stack-4" data-kineglyph-node="stack-4" data-kind="group" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><g id="tool-workflow-960-node-rule" class="kg-node kg-node--rect" data-node-id="rule" data-kineglyph-node="rule" data-kind="rect" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><rect class="kg-node-shape" data-shape-of="rule" fill="var(--kg-color-border, #5d5268)" stroke="none" x="0" y="0" width="960" height="1" rx="0"/></g><g id="tool-workflow-960-node-flow" class="kg-node kg-node--group" data-node-id="flow" data-kineglyph-node="flow" data-kind="group" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><g id="tool-workflow-960-node-stack" class="kg-node kg-node--group" data-node-id="stack" data-kineglyph-node="stack" data-kind="group" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><g id="tool-workflow-960-node-eyebrow-01-list" class="kg-node kg-node--text" data-node-id="eyebrow-01-list" data-kineglyph-node="eyebrow-01-list" data-kind="text" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><text class="kg-text" data-text-of="eyebrow-01-list" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.1" fill="var(--kg-color-info, #79c5d5)" data-wrap-lines="1" data-max-width="66.665" data-text-reveal="lines"><tspan x="0" y="31.2" textLength="66.665" lengthAdjust="spacingAndGlyphs" data-line-width="66.665" data-full-text="01 / LIST">01 / LIST</tspan></text></g><g id="tool-workflow-960-node-heading-pick-a-tool" class="kg-node kg-node--text" data-node-id="heading-pick-a-tool" data-kineglyph-node="heading-pick-a-tool" data-kind="text" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><text class="kg-text" data-text-of="heading-pick-a-tool" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="var(--kg-color-text, #eeeaf0)" data-wrap-lines="1" data-max-width="96.872" data-text-reveal="lines"><tspan x="0" y="61.3" textLength="96.872" lengthAdjust="spacingAndGlyphs" data-line-width="96.872" data-full-text="Pick a tool">Pick a tool</tspan></text></g><g id="tool-workflow-960-node-caption-run-schematio-tool-list" class="kg-node kg-node--text" data-node-id="caption-run-schematio-tool-list" data-kineglyph-node="caption-run-schematio-tool-list" data-kind="text" data-progress="1" style="--kg-progress:1;--kg-highlight:0"><text class="kg-text" data-text-of="caption-run-schematio-tool-list" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="var(--kg-color-text-muted, #b4aaba)" data-wrap-lines="1" data-max-width="154.387" data-text-reveal="lines"><tspan x="0" y="88.05" textLength="154.387" lengthAdjust="spacingAndGlyphs" data-line-width="154.387" data-full-text="Run /schematio tool list.">Run /schematio tool list.</tspan></text></g></g><g id="tool-workflow-960-node-stack