// Optional MC-Inspector is loaded only for interactive release verification.
gradle.beforeProject { project ->
    project.afterEvaluate {
        def inspectorRoot = System.getProperty('schematio.inspector.root')
        if (inspectorRoot && project.path.startsWith(':fabric:')) {
            // -Dschematio.inspector.jar=<path> pins a jar; otherwise the newest build for this version.
            def pinned = System.getProperty('schematio.inspector.jar')
            def jar = pinned ? new File(pinned) : (new File(inspectorRoot, 'build/libs').listFiles() ?: [])
                .findAll { it.isDirectory() }
                .collectMany { dir -> (dir.listFiles() ?: []).findAll { it.name ==~ /MC-Inspector-mc${java.util.regex.Pattern.quote(project.name)}-[0-9.]+\.jar/ } }
                .max { it.lastModified() }
            // Every :fabric: version is configured; only the one being run needs a jar.
            if (jar == null || !jar.isFile()) { project.logger.info("No MC-Inspector jar for ${project.name}"); return }
            project.dependencies.add(project.name.startsWith('26.') ? 'runtimeOnly' : 'modRuntimeOnly', project.files(jar))
            // Loom's development classpath does not unpack this optional mod's nested jars.
            project.dependencies.add('runtimeOnly', 'org.mozilla:rhino:1.7.15')
        }
    }
}
// Opt-in harness for one development client; Loom 1.17 uses RunConfiguration
// properties rather than JavaExec tasks for its generated launch tasks.
gradle.projectsEvaluated {
    def clientGroup = System.getProperty('schematio.smoke.client-group', 'clients')
    if (!(clientGroup ==~ /[a-zA-Z0-9-]+/)) throw new GradleException('Invalid smoke client group')
    allprojects {
        if (plugins.hasPlugin('fabric-loom')) {
            def output = rootProject.file("build/release-readiness/${clientGroup}/${project.name}")
            output.mkdirs()
            def cfg = new File(output, 'config/schematioconnector/config.properties')
            cfg.parentFile.mkdirs()
            cfg.text = "api_endpoint=${System.getProperty('schematio.smoke.endpoint', 'http://127.0.0.1:9/api/v1')}\ntrust_all_certificates=${System.getProperty('schematio.smoke.trust-local', 'false')}\n"
            if (System.getProperty('schematio.inspector.root')) {
                new File(output, 'config/mcinspector.json').text = "{\"port\":${System.getProperty('schematio.inspector.port', '38271')},\"enabled\":true,\"packet_capture\":false}"
            }
            extensions.getByName('loom').runs.named('client') {
                runDirectory.set(output)
                jvmArguments.set(jvmArguments.get().findAll { !it.startsWith('-Ddevauth.enabled=') })
                jvmArguments.add('-XX:ActiveProcessorCount=4')
                def smokeUser = System.getProperty('schematio.smoke.username')
                if (smokeUser) programArgs('--username', smokeUser)
                systemProperties.put('devauth.enabled', System.getProperty('schematio.smoke.authenticated', 'false'))
                systemProperties.put('schematio.smoke.output', output.absolutePath)
                if (!System.getProperty('schematio.smoke.interactive', 'false').toBoolean()) {
                    jvmArguments.add("-javaagent:${rootProject.file('build/release-readiness/client-smoke-agent.jar')}")
                }
            }
        }
    }
}
