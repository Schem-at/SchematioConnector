# Per-version deps for MC 26.3 (verified against Fabric meta + Modrinth 2026-10-20)
# MC 26.x ships UNOBFUSCATED (no Yarn, no mojmap downloads): loom must run in
# its mapping-less/no-remap mode. This property is loom's official switch for
# that (equivalent to applying the `net.fabricmc.fabric-loom` no-remap marker).
fabric.loom.disableObfuscation=true
# MC 26.x requires Java 25 (handled in build.gradle.kts).
# 26.3 replaced GLFW with SDL3 and moved the render backend to com.mojang.renderpearl
# (see the >=26.3 replacements in fabric/stonecutter.gradle.kts).
deps.fabric_api=0.164.0+26.3
# Litematica 0.29.1 (26.3)
deps.litematica=ZqV316KY
# MaLiLib 0.30.2 (26.3)
deps.malilib=JX9bESec
# fabric.mod.json "minecraft" predicate (~26.3 = >=26.3 <26.4)
mod.mc_compat=~26.3

# Optional Axiom 6.1.3: compile-only integration contract, never bundled.
deps.axiom=CrfjL7cY
